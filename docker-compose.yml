services:
  backend:
    build:
      context: ./backend
      args:
        BASE_REGISTRY: docker.m.daocloud.io/library
    image: cloudread-backend:1.0.0
    container_name: cloudread-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - cloudread-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/books?page=1&size=1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BASE_REGISTRY: docker.m.daocloud.io/library
    image: cloudread-frontend:1.0.0
    container_name: cloudread-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  cloudread-data:
